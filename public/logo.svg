<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Eyes -->
  <circle cx="168" cy="208" r="48" fill="#ffffff"/>
  <circle cx="168" cy="208" r="16" fill="#4c1d95"/>
  
  <circle cx="344" cy="208" r="48" fill="#ffffff"/>
  <circle cx="344" cy="208" r="16" fill="#4c1d95"/>

  <!-- Finger Outline -->
  <g stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main index finger -->
    <path d="M 216 512 V 256 A 40 40 0 0 1 296 256 V 512"/>
    
    <!-- Curl (folded thumb or middle finger) -->
    <path d="M 296 384 C 376 384 376 464 304 464"/>
  </g>
</svg>
