services:
  shush-app:
    build: .
    container_name: shush-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DOMAIN=${DOMAIN}
      - RP_ID=${RP_ID}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - BASE_URL=${BASE_URL}
      - API_URL=${API_URL}
      - WS_URL=${WS_URL}
    volumes:
      - shush-data:/app/data
      - shush-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  shush-data:
  shush-uploads:
